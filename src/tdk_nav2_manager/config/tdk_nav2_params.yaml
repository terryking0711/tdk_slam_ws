# bt_navigator
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    # ★ 重規劃頻率不在本檔!是由這個 BT XML 內的 RateController hz="1.0" 決定。
    #   想降低重規劃頻率(已知地圖建議 0.5Hz 甚至改距離觸發),需複製此 XML 改 hz 後
    #   把路徑填到這裡。詳見對話說明。
    # ※ 注意:Humble 這個參數名應為 default_nav_to_pose_bt_xml,且要填完整路徑。
    #   目前這行會被靜默忽略,實際跑的是 Nav2 預設 BT。第一步先不動,之後再處理。
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

# Controller：MPPI（Omni）
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0      # ★改 20→10:CPU 減半,低速下反應足夠

    # 低於此閾值的速度視為 0。麥輪要保留 y！不可設 0。
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # ★改 10→15:整體速度降 1/3 後移動變慢,避免被誤判 stuck 觸發 recovery。
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05           # 6 cm,精準停靠(依你要求維持)
      yaw_goal_tolerance: 0.04          # ~2.9°
      stateful: True                    # xy 達標後只檢查 yaw,防止來回追 xy

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"             # ★ 麥輪/全向輪用 Omni（會輸出 vy）

      time_steps: 32                    # 32 * 0.1 = 3.2 s 預測視野
      model_dt: 0.1                     # ★改 0.05→0.1:必須 = 1 / controller_frequency(現為10Hz)，否則 MPPI configure() 會丟例外導致 controller_server FATAL 崩潰
      batch_size: 1000
                        # CPU 吃緊可降到 1000（精度略降但仍可用）

# --- 取樣標準差：根據 $std \approx v_{max} / 2$ 左右調整，保持靈敏度且不浪費採樣點 ---
      vx_std: 0.40
      vy_std: 0.40
      wz_std: 0.60

      # --- 速度上限（已調高至 1.0）---
      vx_max:  0.8
      vx_min: -0.8
      vy_max:  0.8                     # 橫移速度與直行對齊
      vy_min: -0.8
      wz_max:  0.60

      # --- 加速度上限：根據 1.1 ~ 1.2 秒內煞停的物理特性調高 ---
      ax_max: 0.4                       # 原 0.6 -> 提高到 0.9，確保極速 1.0 可以在 1.1 秒內煞停
      ax_min: -0.4
      ay_max: 0.3                       # 麥輪橫移需要足夠的爆發力克服摩擦力
      ay_min: -0.3
      az_max: 0.6                       # 旋轉加速度保持 1.0，反應較靈敏

      temperature: 0.4
      gamma: 0.015

      # ★微調：由於最高速提升，前瞻視野距離變大 (0.195 * 2.0s = 0.39m)
      # 將 prune_distance 從 0.4 稍微放寬至 0.5m，留給 MPPI 裁剪歷史路徑時更多餘裕
      prune_distance: 0.5
      transform_tolerance: 0.3
      visualize: false

      retry_attempt_limit: 3
      # ★【抖動第一步 4/5】true→false:每輪重新抽樣噪聲會讓相鄰兩輪的最佳解不連續,
      #   輸出就是高頻鋸齒。改 false 讓噪聲序列在迭代間重用,cmd_vel 明顯變平順。
      regenerate_noises: false

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        # ★【抖動第一步 3/5】true→false:逐點做 footprint 碰撞檢查會把成本變成
        #   「撞/不撞」二值,MPPI 加權平均沒有梯度可用,靠牆就 bang-bang。
        #   改 false 後改用中心點查膨脹成本;因為下面 local inflation 已放大到 0.45
        #   (> 外接半徑 0.318),車體尺寸已隱含在成本場裡,安全性不受影響,順便省 CPU。
        consider_footprint: false
        collision_cost: 1000000.0
        near_collision_cost: 253
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 0.50

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.20

      # 麥輪沒有「正面」概念,禁用前進偏好,才能自由橫移/斜走。
      PreferForwardCritic:
        enabled: false

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.6
        offset_from_furthest: 8

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1

      # ※ nav2_mppi_controller 沒有 MotionCritic 這個 plugin,w_excessive_acceleration
      #   也不是真的參數,而且它本來就不在上面的 critics: 清單裡 → 整段是無效設定。
      #   第一步先保留不動(不影響行為),第三步要加抑制抖動的 critic 時改用 TwirlingCritic。
      MotionCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # 關鍵參數：極力懲罰過大的加速度跳變。數值越大，馬達出力越平滑
        w_excessive_acceleration: 5

# Planner：Smac 2D（全向,不考慮車頭,適合麥輪）
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 0.5     # ★改 1.0→0.5:僅 warning 門檻,配合降低重規劃頻率

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# Behavior（recovery 動作）
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6            # ★改 0.45→0.60:與新 wz_max 對齊
    min_rotational_vel: 0.10            # ★改 0.15→0.10
    rotational_acc_lim: 0.5             # ★保持不變: recovery 旋轉加速度也維持

# Local Costmap（滾動視窗）
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 3.0             # ★改 5→3:低速下 3Hz 足夠,省 CPU
      publish_frequency: 1.0            # ★改 2→1:只影響 RViz 顯示
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true

      # ★改 4x4→3x3:MPPI 視野縮短(~0.26m)+prune 0.4m,3m 視窗綽綽有餘,省 CPU
      width: 3
      height: 3
      resolution: 0.05

      # 45cm x 45cm 方形車體。前提:base_footprint 在車體幾何中心。
      # 內切半徑 = 0.225 m,外接半徑 = 0.225 * sqrt(2) = 0.318 m
      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5       # ★改 3.0→2.5:視窗縮小後不需 raytrace 那麼遠
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0       # ★改 2.5→2.0:同上,減少每幀處理的點數
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # ★【抖動第一步 1/5】0.20→0.45:原值比內切半徑 0.225 還小,
        #   InflationLayer 的衰減區間等於不存在 → 牆邊 0.2m 內全是 253、外面直接 0,
        #   成本場是懸崖不是斜坡,MPPI 沒有梯度可跟,靠牆必抖。
        #   0.45 > 外接半徑 0.318,才會有真正的連續梯度,也與 global 一致。
        inflation_radius: 0.01
        # ★【抖動第一步 2/5】5.0→2.5:衰減係數放小,成本從牆面平緩下降,
        #   配合上面的 0.45 才能形成可微的成本坡。
        cost_scaling_factor: 1.0

      always_send_full_costmap: True

# Global Costmap
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 0.5             # ★改 1.0→0.5:已知地圖,靜態層為主,0.5Hz 夠
      publish_frequency: 0.5            # ★改 1.0→0.5
      global_frame: map
      robot_base_frame: base_footprint

      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true

      plugins:
        - static_layer
        # - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # obstacle_layer:
      #   plugin: "nav2_costmap_2d::ObstacleLayer"
      #   enabled: True
      #   observation_sources: scan
      #   scan:
      #     topic: /scan
      #     max_obstacle_height: 2.0
      #     clearing: True
      #     marking: True
      #     data_type: "LaserScan"
      #     raytrace_max_range: 3.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # ※ 第一步維持不動。若任務點是貼牆的(距牆 < 0.45m),再執行第二步把這裡
        #   改成 0.30 / 2.0,否則 planner 會因終點成本過高而只規劃到 0.2m 外。
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: True

# Waypoint Follower
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Velocity Smoother（★ 全檔唯一一個,數值已與 MPPI 對齊）
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0           # 保持 20Hz:負擔極輕,輸出到底盤更平滑
    scale_velocities: false

    # OPEN_LOOP：用上一筆指令估目前速度（模擬常用）。
    # 實車若 odom 準，可改 CLOSED_LOOP 讓平滑更貼實際。
    feedback: "OPEN_LOOP"

# [X, Y, Theta] ★改:與 MPPI 新上限完全對齊。麥輪務必保留 Y!
    max_velocity: [0.80, 0.80, 0.6]   # X, Y 調高至 0.80，Theta 降至 0.6
    min_velocity: [-0.80, -0.80, -0.6]
    max_accel: [0.4, 0.3, 0.6]        # ★ 加速度同步調高至 0.9，確保高速時煞得住
    max_decel: [-0.4, -0.3, -0.6]      # 減速度與加速度對齊

    odom_topic: /odom
    odom_duration: 0.1
    # ★【抖動第一步 5/5】全 0 → 給死區:低於此值的指令直接輸出 0,
    #   直接吃掉圖上那種 ±0.05 m/s 的殘留鋸齒(麥輪在這個速度本來也推不動)。
    #   若發現最後幾公分收斂變慢,把 x/y 降到 0.015 再試。
    deadband_velocity: [0.02, 0.02, 0.04]
    velocity_timeout: 1.0

# Lifecycle Manager
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother